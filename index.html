<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Murder Walk</title>
<meta name="description" content="A murder mystery you walk. Eight leads at real places in your own streets, five witnesses, one liar. Play in English or Dutch.">
<link rel="canonical" href="https://murderwalk.com/">
<meta property="og:title" content="Murder Walk">
<meta property="og:description" content="A murder mystery you walk. Eight leads in your own streets, five witnesses, one liar.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://murderwalk.com/">
<link rel="alternate" hreflang="en" href="https://murderwalk.com/">
<link rel="alternate" hreflang="nl" href="https://moordwandeling.nl/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap">
<style>body{margin:0}</style>
<style>#root{height:100%}
/* Layout: één scherm als nachtkaart; dossierpapier schuift er als vel overheen. Eén donkere wereld, bewust zonder licht thema. */
:root{
  color-scheme:dark;
  --night:#101a2b; --night2:#182741; --street:#2c3f62; --fog:#93a6c6;
  --paper:#ece4d2; --ink:#1b2233; --lamp:#f0a63a; --spook:#a6ead9; --blood:#d8503f;
  --f-type:'Special Elite','Courier New',monospace;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;padding-inline:16px;padding-block:20px}
.wrap{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-type);font-weight:400;font-size:clamp(40px,12vw,58px);line-height:1;margin:0;color:var(--lamp);text-wrap:balance}
h2{font-family:var(--f-type);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--fog)}
p{margin:0}
.lead{color:var(--fog);max-width:46ch}
.btn{display:block;width:100%;padding:14px 16px;border-radius:4px;background:var(--lamp);color:var(--ink);font-weight:600;font-size:17px;text-align:center}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--street)}
.btn.red{background:var(--blood);color:#fff}
.btn:disabled{opacity:.45}
.btn.sm{width:auto;align-self:center;padding:8px 14px;font-size:14px;font-weight:500}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--street);border:1px solid var(--street)}
.strip div{background:var(--night2);padding:10px 8px;text-align:center}
.strip b{display:block;font-family:var(--f-type);font-weight:400;font-size:20px;color:var(--spook);font-variant-numeric:tabular-nums}
.strip span{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--fog)}
.xp{height:6px;background:var(--night2);border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--lamp)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:10px;border:1px solid var(--street);border-radius:4px;color:var(--fog)}
.seg button[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.how{display:flex;flex-direction:column;gap:6px;color:var(--fog);font-size:15px;padding-left:18px;margin:0}
.note{font-size:13px;color:var(--fog)}
#hero{position:absolute;inset:0;width:100%;height:100%;display:block}
#home .wrap{min-height:100%}
.row0{display:flex;justify-content:space-between;align-items:center;gap:10px}
#snd,#lang{white-space:nowrap;flex:none;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;border:1px solid var(--street);border-radius:20px;padding:5px 12px;background:rgba(16,26,43,.6)}
#ttl{transform-origin:50% 60%;will-change:transform;text-shadow:1px 1px 0 #c4832a,2px 2px 0 #a36b1f,3px 3px 0 #825416,4px 4px 0 #613e0e,10px 14px 20px rgba(0,0,0,.75)}
#typed{font-family:var(--f-type);min-height:3em;text-shadow:0 2px 8px #000}
.gap{flex:1;min-height:250px}
/* papier */
.paper{background:var(--paper);color:var(--ink);padding:18px 16px;border-radius:2px;display:flex;flex-direction:column;gap:12px}
.paper h2{color:var(--ink)}
.paper .eyebrow{color:#6a6250}
/* kaart */
#play{padding:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(16,26,43,.88);border-bottom:1px solid var(--street);padding-top:env(safe-area-inset-top,0px)}
#hud div{padding:7px 4px;text-align:center}
#hud b{display:block;font-family:var(--f-type);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
#hud span{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--fog)}
#zoom{position:absolute;right:12px;top:74px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;background:rgba(24,39,65,.92);border:1px solid var(--street);border-radius:4px;font-size:20px}
#low{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
#radar{align-self:flex-start;background:rgba(16,26,43,.9);border:1px solid var(--street);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--spook)}
#chip{background:var(--paper);color:var(--ink);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px}
#chip .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
#chip b{font-family:var(--f-type);font-weight:400;font-size:17px;min-width:0}
#chip .btn{padding:10px;font-size:15px}
#bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#bar button{padding:12px 4px;background:rgba(24,39,65,.95);border:1px solid var(--street);border-radius:4px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
#bar button.red{background:var(--blood);border-color:var(--blood);color:#fff}
/* vellen */
.sheet{position:absolute;inset:0;background:rgba(8,13,22,.78);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>.paper{width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:6px 6px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:8px;border-bottom:2px solid #c9bfa6;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:#6a6250}
.tabs button[aria-selected="true"]{border-color:var(--blood);color:var(--ink)}
.sus{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid #c9bfa6;border-radius:3px;text-align:left;width:100%}
.sus b{font-family:var(--f-type);font-weight:400}
.sus small{color:#6a6250}
.sus.out{opacity:.4;text-decoration:line-through}
.sus.pick{border-color:var(--blood);box-shadow:inset 0 0 0 1px var(--blood)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags i{font-style:normal;font-size:12px;background:#d9cfb6;padding:2px 6px;border-radius:2px}
.clue{padding:10px;border-left:3px solid var(--lamp);background:#e2d8c0;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.clue.wit{border-color:#3d8f80}
.clue.m1{border-color:#2e7d4f}.clue.m2{border-color:var(--blood)}
.clue em{font-style:normal;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:#6a6250}
.list{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
#mgbox{display:flex;flex-direction:column;gap:10px;align-items:center}
#mgbox canvas.sq{width:min(260px,100%);aspect-ratio:1;background:var(--night);border-radius:4px;touch-action:none}
.dustw{position:relative;width:min(260px,100%);aspect-ratio:1;background:var(--night);border-radius:4px;overflow:hidden}
.dustw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.dustw div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-family:var(--f-type);color:var(--lamp);font-size:22px}
.lans{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(220px,100%);background:var(--night);padding:16px;border-radius:4px}
.lan{aspect-ratio:1;border-radius:50%;background:#2a3550;border:2px solid #4a5b79}
.lan.on{background:var(--lamp);box-shadow:0 0 22px var(--lamp)}
.dig{display:flex;gap:8px}
.dig button{width:54px;height:60px;background:var(--ink);color:var(--paper);font-family:var(--f-type);font-size:28px;border-radius:4px}
.hist{display:flex;flex-direction:column;gap:4px;font-family:var(--f-type)}
.hist span{display:inline-block;width:30px;text-align:center;padding:2px;margin:0 2px;border-radius:2px;color:#fff}
.g0{background:#8a8372}.g1{background:#b8860b}.g2{background:#2e7d4f}
.big{font-family:var(--f-type);font-size:30px;letter-spacing:.2em;background:var(--ink);color:var(--spook);padding:14px 10px;border-radius:4px;width:100%;text-align:center;overflow-wrap:anywhere}
.rowb{display:flex;gap:8px;width:100%}
.rowb .btn{padding:10px}
.btn.dk{color:var(--ink);border-color:#c9bfa6}
input[type=range]{width:100%;accent-color:var(--blood)}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.book div{border:1px solid #c9bfa6;border-radius:3px;padding:8px 6px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.book div.no{opacity:.35}
.book b{font-family:var(--f-type);font-weight:400;font-size:13px}
.r1{color:#3d6f66}.r2{color:#7a4fa3}.r3{color:#b5651d}
.stars{font-size:34px;letter-spacing:6px;color:var(--lamp);font-family:var(--f-type)}
#ar{position:absolute;inset:0;z-index:8;background:#000}
#ar video,#ar canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;touch-action:none}
#arX{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;background:rgba(16,26,43,.8)}
#load{position:absolute;inset:0;z-index:7;background:rgba(16,26,43,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#load b{font-family:var(--f-type);font-weight:400;font-size:22px;color:var(--lamp);text-wrap:balance}
#load span{color:var(--fog);font-size:14px;max-width:30ch}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid var(--street);border-top-color:var(--lamp);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a.btn{text-decoration:none}
.inp{width:100%;padding:12px;border:1px solid #c9bfa6;border-radius:4px;background:#fff;color:var(--ink);font-family:var(--f-type);font-size:20px;text-transform:uppercase;letter-spacing:.1em;text-align:center}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--lamp);color:var(--ink);padding:8px 14px;border-radius:4px;font-weight:600;z-index:9;max-width:88%;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="h-nl">

<div id="app">
  <canvas id="hero"></canvas>
  <section class="screen" id="home">
    <div class="wrap">
      <div class="row0"><div class="eyebrow">Een moordzaak in je eigen straten</div><div class="row0"><button type="button" id="lang">English</button><button type="button" id="snd" aria-pressed="false">Regen uit</button></div></div>
      <h1 id="ttl">Moord&shy;wandeling</h1>
      <p id="typed"></p>
      <div class="gap"></div>
      <p class="lead">Loop door je buurt. Zoek bewijs, vang de schimmen die iets gezien hebben en wijs de dader aan. Precies één getuige liegt.</p>
      <div class="strip">
        <div><b id="pRank">Aspirant</b><span>Rang</span></div>
        <div><b id="pStreak">0</b><span>Dagen op rij</span></div>
        <div><b id="pBook">0/12</b><span>Schimmen</span></div>
      </div>
      <div><div class="xp"><i id="pXp" style="width:0%"></i></div><p class="note" id="pNext"></p></div>
      <div class="seg" id="len">
        <button type="button" data-r="380" data-par="45" aria-pressed="false">Kort · 45 min</button>
        <button type="button" data-r="650" data-par="90" aria-pressed="true">Volledig · 90 min</button>
      </div>
      <button class="btn" id="bResume" hidden>Ga verder met je zaak</button>
      <button class="btn" id="bGps">Start de zaak van vandaag</button>
      <button class="btn ghost" id="bRandom">Extra zaak op deze plek</button>
      <button class="btn ghost sm" id="bDemo">Proefronde in fictief Amsterdam</button>
      <button class="btn ghost" id="bPro" hidden></button>
      <p class="note" id="status"></p>
      <ol class="how">
        <li>De kaart zet acht sporen neer bij echte plekken om je heen: de kerk, de bushalte, het café.</li>
        <li>Kom binnen 35 meter en het spoor gaat open. Bewijs is altijd waar. Van de vijf getuigen liegt er één.</li>
        <li>Zeldzame schimmen duiken alleen op als je dichtbij bent. Vang ze voor je Schimmenboek en een tip.</li>
      </ol>
      <button class="btn ghost" id="bBookHome">Schimmenboek</button>
      <button class="btn ghost sm" id="bWipe">Wissen</button>
      <p class="note">Blijf op de openbare weg en let op het verkeer. Je hoeft nergens naar binnen.</p>
    </div>
  </section>

  <section class="screen" id="brief" hidden>
    <div class="wrap">
      <div class="paper">
        <div class="eyebrow" id="bfNo"></div>
        <h2 id="bfTitle"></h2>
        <p id="bfText"></p>
        <div class="eyebrow">Zes verdachten</div>
        <div class="list" id="bfSus"></div>
      </div>
      <button class="btn" id="bGo">De nacht in</button>
      <button class="btn ghost" id="bBack">Terug</button>
    </div>
  </section>

  <section class="screen" id="play" hidden>
    <canvas id="map"></canvas>
    <div id="hud">
      <div><b id="hT">0:00</b><span>Tijd</span></div>
      <div><b id="hS">0/8</b><span>Sporen</span></div>
      <div><b id="hG">0/3</b><span>Schimmen</span></div>
      <div><b id="hD">0,0</b><span>Km</span></div>
    </div>
    <div id="zoom">
      <button type="button" id="zM" aria-label="Menu">☰</button>
      <button type="button" id="zIn" aria-label="Inzoomen">+</button>
      <button type="button" id="zOut" aria-label="Uitzoomen">−</button>
      <button type="button" id="zMe" aria-label="Centreer op mij">◎</button>
      <button type="button" id="zS" aria-label="Geluid aan of uit">♪</button>
    </div>
    <div id="low">
      <div id="radar">Zoek het eerste spoor</div>
      <div id="chip" hidden>
        <div class="row"><b id="cName"></b><span id="cDist"></span></div>
        <span id="cHint" class="note" style="color:#6a6250"></span>
        <button class="btn" id="cAct"></button>
      </div>
      <div id="bar">
        <button type="button" id="bNote">Notitieboek</button>
        <button type="button" id="bBook">Schimmen</button>
        <button type="button" id="bAcc" class="red">Beschuldig</button>
      </div>
    </div>
  </section>

  <div class="sheet" id="sheet" hidden><div class="paper" id="sheetBody"></div></div>
  <div id="ar" hidden><video id="arV" playsinline muted autoplay></video><canvas id="arC"></canvas><button type="button" class="btn ghost" id="arX">Camera uit</button></div>
  <div id="load" hidden role="status"><div class="spin"></div><b id="loadT"></b><span>Dit duurt meestal 5 tot 30 seconden. Blijf even op deze pagina.</span></div>
  <div id="toast" hidden></div>
</div>

</script>
<script type="text/plain" id="a-nl">
/* ---------- zaakgenerator (puur, controleerbaar) ---------- */
function rngOf(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const POOL=[["Ilse Verbrugge", "de notaris"], ["Ruben Achterberg", "de slager"], ["Mirjam de Wolf", "de dirigente"], ["Tobias Koolen", "de taxichauffeur"], ["Fenna Oosterhout", "de dierenarts"], ["Hendrik Maas", "de kastelein"], ["Saar Lindeman", "de journaliste"], ["Otto Pruim", "de antiquair"], ["Noor Haverkamp", "de wethouder"], ["Gijs Terlouw", "de fietsenmaker"], ["Liesbeth Kramer", "de bakker"], ["Jurre van Dam", "de makelaar"], ["Annemiek Bos", "de huisarts"], ["Daan Schippers", "de havenmeester"], ["Roos Winter", "de bloemist"], ["Klaas Hoekstra", "de boekhouder"], ["Vera Zwart", "de kapster"], ["Bram Doornbos", "de tuinman"], ["Hanna Brouwer", "de lerares"], ["Sjoerd Postma", "de brandweercommandant"]];
const VICTIMS=[["Cornelis Vermaat", "gepensioneerd bankdirecteur", "Hij leende half het dorp geld en vergat nooit een schuld."], ["Adèle Rozenburg", "kunsthandelaar", "Ze verkocht vorige maand een schilderij dat niet van haar was."], ["Wessel Dijkgraaf", "projectontwikkelaar", "Zijn bouwplan zou zes tuinen en één kroeg laten verdwijnen."], ["Thera Blom", "dorpsarchivaris", "Ze had net een doos oude brieven gevonden en wilde erover praten."], ["Barend Slootweg", "veilingmeester", "Hij wist van elk huis in het dorp wat de inboedel waard was."], ["Margriet van Hasselt", "oud-burgemeester", "Ze bewaarde dertig jaar aan gunsten en wist precies wie haar nog iets schuldig was."], ["Evert Koning", "huisbaas", "Hij verhoogde de huur per brief en kwam nooit zelf langs."], ["Lidewij Storm", "apotheker", "Ze wist wie welke pillen slikte, en zweeg daar niet altijd over."], ["Joris Hagedoorn", "voorzitter van de voetbalclub", "De clubkas klopte al jaren niet, en hij had als enige de sleutel."], ["Philippa de Ruyter", "juwelier", "Ze nam sieraden in onderpand en gaf ze zelden terug."], ["Maarten Schuurman", "schooldirecteur", "Hij had een la vol dossiers over oud-leerlingen en hun ouders."], ["Greetje Valk", "grootgrondbezitter", "Het halve dorp pachtte grond van haar, en de contracten liepen dit jaar af."]];
const TR={jas:["zwart","grijs","rood"],bril:["bril","geen bril"],hand:["links","rechts"],schoen:["laarzen","sneakers","nette schoenen"],lengte:["lang","kort"]};
const TRL={jas:"jas",bril:"",hand:"handig",schoen:"",lengte:""};
const ADJ={zwart:"zwarte",grijs:"grijze",rood:"rode"};
function evText(t,v){
  if(t==="jas")return["Vezel","Aan het hek hangt een "+ADJ[v]+" wollen vezel. De dader droeg een "+ADJ[v]+" jas."];
  if(t==="bril")return v==="bril"?["Brilpoot","In de goot ligt een afgebroken brilpoot met bloed eraan. De dader draagt een bril."]:["Camerabeeld","Een deurbelcamera ving het gezicht. Onscherp, maar zeker: de dader draagt geen bril."];
  if(t==="hand")return["Sectierapport","De hoek van de wond laat geen twijfel. De dader is "+v+"handig."];
  if(t==="schoen")return["Schoenafdruk","Een verse afdruk in de modder. De dader droeg "+v+"."];
  return["Schaduwfoto","De lantaarn wierp een schaduw op de muur. De dader is "+(v==="lang"?"lang":"klein van stuk")+"."];
}
function witText(t,v){
  if(t==="jas")return"Ik zag iemand wegrennen in een "+ADJ[v]+" jas.";
  if(t==="bril")return v==="bril"?"Die figuur droeg een bril. Het glas blonk in het lantaarnlicht.":"Ik keek die figuur recht aan. Geen bril.";
  if(t==="hand")return"Die gooide iets in de struiken. Met "+v+".";
  if(t==="schoen")return v==="laarzen"?"Ik hoorde zware laarzen op de klinkers.":v==="sneakers"?"Sneakers had die aan. Dat zag ik goed.":"Tikkende zolen van nette schoenen. Dat hoor je meteen.";
  return v==="lang"?"Een lang figuur, een kop groter dan ik.":"Een klein figuur, kwam amper boven de heg uit.";
}
function traitMask(sus,t,v){let m=0;sus.forEach((s,i)=>{if(s.tr[t]===v)m|=1<<i});return m}
function solve(c){ // alle daders die passen bij: bewijs waar, precies één getuige liegt
